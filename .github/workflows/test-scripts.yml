name: Test scripts

on:
  pull_request:
    paths:
      - "scripts/**"
      - "docs.json"
      - "AGENTS.md"
      - "api-reference/openapi.yaml"
      - "api-reference/openapi.json"
  push:
    branches:
      - main
    paths:
      - "scripts/**"
      - "docs.json"
      - "AGENTS.md"
      - "api-reference/openapi.yaml"
      - "api-reference/openapi.json"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs
